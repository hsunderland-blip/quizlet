<!DOCTYPE html>
<html>
<head>
  <title>MathQuiz</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #8ed8ff;
    }

    #codeScreen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #46178f;
      color: white;
      text-align: center;
      padding-top: 110px;
    }

    #codeScreen h1 {
      font-size: 60px;
      margin: 10px;
    }

    #codeScreen input {
      width: 250px;
      padding: 15px;
      font-size: 20px;
      text-align: center;
      border: 0;
      border-radius: 8px;
    }

    button {
      padding: 13px 25px;
      margin: 10px;
      border: 0;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }

    #game {
      display: none;
    }

    #hud {
      position: fixed;
      top: 15px;
      left: 15px;
      color: white;
      font-weight: bold;
      font-size: 19px;
      text-shadow: 2px 2px 4px black;
      z-index: 10;
    }

    #shopButton {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 10;
    }

    #shop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      color: white;
      z-index: 50;
      text-align: center;
      padding-top: 60px;
    }

    .sled {
      display: inline-block;
      width: 190px;
      padding: 15px;
      margin: 10px;
      background: rgba(255,255,255,.15);
      border-radius: 12px;
    }

    #crash {
      display: none;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      z-index: 30;
      color: white;
      text-align: center;
      font-size: 45px;
      font-weight: bold;
      text-shadow: 3px 3px 5px black;
    }
  </style>
</head>

<body>

<div id="codeScreen">
  <h1>MathQuiz</h1>
  <h2>Enter Game Code</h2>

  <input id="code" placeholder="Game Code">

  <br>

  <button onclick="unlock()">ENTER</button>

  <p id="wrong"></p>
</div>


<div id="game">

  <div id="hud">
    🪙 Coins: <span id="coins">0</span>
    &nbsp;&nbsp;
    🏁 Distance: <span id="distance">0</span>
    &nbsp;&nbsp;
    ⚡ Speed: <span id="speed">0</span>
  </div>

  <button id="shopButton" onclick="openShop()">
    🛷 SLED SHOP
  </button>

  <div id="shop">

    <h1>SLED SHOP</h1>

    <p>Choose your sled</p>

    <div class="sled">
      <h2>Classic</h2>
      <p>Balanced</p>
      <button onclick="chooseSled(0)">
        SELECT
      </button>
    </div>

    <div class="sled">
      <h2>Blizzard</h2>
      <p>Faster</p>
      <button onclick="chooseSled(1)">
        SELECT
      </button>
    </div>

    <div class="sled">
      <h2>Rocket</h2>
      <p>Very fast</p>
      <button onclick="chooseSled(2)">
        SELECT
      </button>
    </div>

    <br>

    <button onclick="closeShop()">
      CLOSE
    </button>

  </div>


  <div id="crash">

    💥 CRASH!

    <br>

    <button onclick="restart()">
      RESTART
    </button>

  </div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =========================
   CODE SCREEN
========================= */

function unlock() {

  const code =
    document.getElementById("code").value;

  if (code === "223605") {

    document.getElementById("codeScreen").style.display =
      "none";

    document.getElementById("game").style.display =
      "block";

    startGame();

  } else {

    document.getElementById("wrong").innerText =
      "Wrong code!";

  }

}


/* =========================
   THREE.JS
========================= */

let scene;
let camera;
let renderer;

let sled;

let obstacles = [];
let coinsList = [];

let running = false;
let crashed = false;

let playerX = 0;

let speed = 0.25;

let distance = 0;
let coins = 0;

let selectedSled = 0;

let keys = {};


/* =========================
   SLED TYPES
========================= */

const sleds = [

  {
    name: "Classic",
    color: 0xd93636,
    speed: 0.25
  },

  {
    name: "Blizzard",
    color: 0x38a8ff,
    speed: 0.31
  },

  {
    name: "Rocket",
    color: 0xf2b632,
    speed: 0.38
  }

];


/* =========================
   CONTROLS
========================= */

document.addEventListener(
  "keydown",
  e => {

    keys[e.key.toLowerCase()] = true;

  }
);

document.addEventListener(
  "keyup",
  e => {

    keys[e.key.toLowerCase()] = false;

  }
);


/* =========================
   START
========================= */

function startGame() {

  scene =
    new THREE.Scene();

  scene.background =
    new THREE.Color(0x8ed8ff);


  camera =
    new THREE.PerspectiveCamera(
      70,
      window.innerWidth /
      window.innerHeight,
      0.1,
      1000
    );


  renderer =
    new THREE.WebGLRenderer({
      antialias: true
    });

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  document
    .getElementById("game")
    .appendChild(renderer.domElement);


  /* LIGHT */

  const light =
    new THREE.HemisphereLight(
      0xffffff,
      0x668899,
      1.5
    );

  scene.add(light);


  /* CAMERA */

  camera.position.set(
    0,
    4,
    7
  );


  /* SLOPE */

  createSlope();


  /* PLAYER */

  createSled();


  /* WORLD */

  createWorld();


  running = true;

  crashed = false;

  requestAnimationFrame(loop);

}


/* =========================
   SLOPE
========================= */

function createSlope() {

  const geometry =
    new THREE.PlaneGeometry(
      18,
      2000
    );

  const material =
    new THREE.MeshStandardMaterial({
      color: 0xf5fbff
    });

  const slope =
    new THREE.Mesh(
      geometry,
      material
    );

  slope.rotation.x =
    -Math.PI / 2;

  slope.position.y = 0;

  slope.position.z = -900;

  scene.add(slope);

}


/* =========================
   SLED
========================= */

function createSled() {

  sled =
    new THREE.Group();


  const bodyGeometry =
    new THREE.BoxGeometry(
      1.4,
      0.25,
      2.3
    );

  const bodyMaterial =
    new THREE.MeshStandardMaterial({
      color:
        sleds[selectedSled].color
    });


  const body =
    new THREE.Mesh(
      bodyGeometry,
      bodyMaterial
    );


  sled.add(body);


  /* RIDER */

  const riderGeometry =
    new THREE.BoxGeometry(
      .55,
      1.1,
      .55
    );

  const riderMaterial =
    new THREE.MeshStandardMaterial({
      color: 0x2459c8
    });


  const rider =
    new THREE.Mesh(
      riderGeometry,
      riderMaterial
    );

  rider.position.y =
    .65;

  sled.add(rider);


  /* HEAD */

  const headGeometry =
    new THREE.SphereGeometry(
      .32,
      16,
      16
    );

  const headMaterial =
    new THREE.MeshStandardMaterial({
      color: 0xf0c5a3
    });


  const head =
    new THREE.Mesh(
      headGeometry,
      headMaterial
    );

  head.position.y =
    1.35;

  sled.add(head);


  sled.position.set(
    0,
    .45,
    3
  );


  scene.add(sled);

}


/* =========================
   WORLD
========================= */

function createWorld() {

  for (
    let i = 0;
    i < 80;
    i++
  ) {

    createObstacle(
      -i * 18 - 30
    );

  }


  for (
    let i = 0;
    i < 60;
    i++
  ) {

    createCoin(
      -i * 25 - 45
    );

  }

}


/* =========================
   OBSTACLE
========================= */

function createObstacle(z) {

  let x;

  /*
    Keep a large safe area
    around the starting point.
  */

  do {

    x =
      (Math.random() * 2 - 1)
      * 6;

  } while (
    Math.abs(x) < 2.2 &&
    z > -120
  );


  const geometry =
    Math.random() > .5

      ? new THREE.ConeGeometry(
          1.1,
          3.5,
          8
        )

      : new THREE.DodecahedronGeometry(
          1.3
        );


  const material =
    new THREE.MeshStandardMaterial({
      color:
        Math.random() > .5
          ? 0x276b45
          : 0x777777
    });


  const obstacle =
    new THREE.Mesh(
      geometry,
      material
    );


  obstacle.position.set(
    x,
    1,
    z
  );


  obstacle.userData.hitbox =
    new THREE.Box3();


  scene.add(obstacle);

  obstacles.push(obstacle);

}


/* =========================
   COIN
========================= */

function createCoin(z) {

  const x =
    (Math.random() * 2 - 1)
    * 5;


  const geometry =
    new THREE.TorusGeometry(
      .45,
      .14,
      10,
      20
    );


  const material =
    new THREE.MeshStandardMaterial({
      color: 0xffd633
    });


  const coin =
    new THREE.Mesh(
      geometry,
      material
    );


  coin.position.set(
    x,
    1.2,
    z
  );


  coin.rotation.x =
    Math.PI / 2;


  coin.userData.hitbox =
    new THREE.Box3();


  scene.add(coin);

  coinsList.push(coin);

}


/* =========================
   GAME LOOP
========================= */

function loop() {

  if (!running) return;

  update();

  renderer.render(
    scene,
    camera
  );

  requestAnimationFrame(loop);

}


/* =========================
   UPDATE
========================= */

function update() {

  if (crashed) return;


  /* STEERING */

  if (
    keys["a"] ||
    keys["arrowleft"]
  ) {

    playerX -= .13;

  }


  if (
    keys["d"] ||
    keys["arrowright"]
  ) {

    playerX += .13;

  }


  playerX =
    Math.max(
      -6,
      Math.min(6, playerX)
    );


  /* MOVE PLAYER */

  sled.position.x +=
    (playerX - sled.position.x)
    * .15;


  /* MOVE WORLD */

  const currentSpeed =
    sleds[selectedSled].speed;


  for (
    const obstacle of obstacles
  ) {

    obstacle.position.z +=
      currentSpeed;


    if (
      obstacle.position.z > 12
    ) {

      obstacle.position.z =
        -1500;

      obstacle.position.x =
        (Math.random() * 2 - 1)
        * 6;

    }


    /* ACCURATE HITBOX */

    obstacle.userData.hitbox
      .setFromObject(obstacle);


    const playerBox =
      new THREE.Box3()
        .setFromObject(sled);


    if (
      playerBox.intersectsBox(
        obstacle.userData.hitbox
      )
    ) {

      crash();

      return;

    }

  }


  /* COINS */

  for (
    const coin of coinsList
  ) {

    coin.position.z +=
      currentSpeed;

    coin.rotation.z += .08;


    if (
      coin.position.z > 12
    ) {

      coin.position.z =
        -1500;

    }


    coin.userData.hitbox
      .setFromObject(coin);


    const playerBox =
      new THREE.Box3()
        .setFromObject(sled);


    if (
      playerBox.intersectsBox(
        coin.userData.hitbox
      )
    ) {

      coins++;

      document.getElementById("coins")
        .innerText = coins;

      coin.position.z =
        -1500;

    }

  }


  /* DISTANCE */

  distance +=
    currentSpeed;


  document.getElementById("distance")
    .innerText =
    Math.floor(distance * 10);


  document.getElementById("speed")
    .innerText =
    Math.floor(currentSpeed * 100);


  /* CAMERA */

  camera.position.x +=
    (sled.position.x -
     camera.position.x)
    * .08;


  camera.lookAt(
    sled.position.x,
    0,
    -10
  );

}


/* =========================
   CRASH
========================= */

function crash() {

  crashed = true;

  running = false;

  document.getElementById("crash")
    .style.display = "block";

}


/* =========================
   RESTART
========================= */

function restart() {

  location.reload();

}


/* =========================
   SHOP
========================= */

function openShop() {

  if (running) {

    running = false;

  }

  document.getElementById("shop")
    .style.display = "block";

}


function closeShop() {

  document.getElementById("shop")
    .style.display = "none";

  if (!crashed) {

    running = true;

    requestAnimationFrame(loop);

  }

}


function chooseSled(number) {

  selectedSled = number;

  document.getElementById("shop")
    .style.display = "none";

  /*
    Change the existing sled's colour.
  */

  sled.children[0]
    .material.color.setHex(
      sleds[number].color
    );


  if (!crashed) {

    running = true;

    requestAnimationFrame(loop);

  }

}


/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  function() {

    if (!camera || !renderer)
      return;

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
